version: '3'
services:
  backend:
    image: node:22.19-alpine
    working_dir: /usr/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      - NODE_ENV=development
    volumes:
      - "./backend:/usr/app"
      - "/usr/app/node_modules"
    ports:
      - "3000:3000"
  frontend:
    image: node:22.19-alpine
    working_dir: /usr/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
    volumes:
      - "./frontend:/usr/app"
      - "/usr/app/node_modules"
    ports:
      - "3004:3001"
